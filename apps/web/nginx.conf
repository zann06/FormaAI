# Serves the FormaAI single-page app and proxies API calls to the api service.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Match the API's MAX_FILE_MB so uploads are not rejected at the proxy.
    client_max_body_size 30m;

    # Security headers for the static app. The API sets its own response headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxied API. `proxy_pass` without a URI keeps the /api prefix intact.
    location /api/ {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Large uploads and long-running export downloads.
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # Fingerprinted build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: unknown paths render the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
